<script>
const QUESTIONS=[{"id":1,"competency":"Kepribadian","subcompetency":"Integritas","question":"Dalam proses pengadaan sekolah, seorang kerabat kepala sekolah menawarkan barang dengan harga kompetitif tetapi meminta diprioritaskan tanpa proses yang semestinya. Tindakan paling tepat adalah ...","options":["Tetap memprioritaskan karena harganya murah","Meminta kerabat mengikuti proses yang transparan dan menghindari konflik kepentingan","Menyerahkan keputusan kepada kerabat","Menghentikan seluruh pengadaan","Memilih pemasok berdasarkan hubungan pribadi"],"answer":1,"explanation":"Integritas menuntut proses yang transparan, adil, dan bebas konflik kepentingan.","keywords":"transparansi • integritas • konflik kepentingan"},{"id":2,"competency":"Kepribadian","subcompetency":"Kematangan emosional","question":"Seorang guru mengkritik kebijakan kepala sekolah dengan nada keras dalam rapat. Respons paling tepat adalah ...","options":["Membalas dengan nada yang sama","Menghentikan guru tersebut berbicara","Mendengarkan, meminta fakta pendukung, lalu mengarahkan pembahasan pada solusi","Memberi sanksi langsung","Mengabaikan kritik"],"answer":2,"explanation":"Kepala sekolah perlu mengelola emosi, menerima masukan, dan menjaga diskusi tetap konstruktif.","keywords":"tenang • fakta • dialog • solusi"},{"id":3,"competency":"Kepribadian","subcompetency":"Tanggung jawab","question":"Target program sekolah tidak tercapai. Tim mengusulkan laporan dibuat seolah-olah target tercapai. Kepala sekolah sebaiknya ...","options":["Menyetujui agar citra sekolah baik","Menghapus indikator yang gagal","Melaporkan kondisi sebenarnya disertai analisis penyebab dan tindak lanjut","Menyalahkan panitia","Tidak membuat laporan"],"answer":2,"explanation":"Akuntabilitas menuntut data dan laporan yang jujur, disertai pembelajaran dari kekurangan.","keywords":"jujur • akuntabel • refleksi • tindak lanjut"},{"id":4,"competency":"Kepribadian","subcompetency":"Refleksi diri","question":"Hasil evaluasi menunjukkan kepala sekolah kurang mampu menggunakan data pembelajaran. Langkah terbaik adalah ...","options":["Menghindari data","Menunggu orang lain membantu","Menyusun rencana pengembangan diri, belajar terarah, menerapkan, lalu merefleksikan hasil","Menyerahkan seluruh analisis kepada operator","Mengurangi evaluasi"],"answer":2,"explanation":"Pengembangan diri yang terencana dan reflektif merupakan bagian penting dari kepemimpinan profesional.","keywords":"pengembangan diri • belajar • praktik • refleksi"},{"id":5,"competency":"Kepribadian","subcompetency":"Konsistensi","question":"Kepala sekolah meminta guru disiplin hadir tepat waktu, tetapi dirinya sering datang terlambat. Perbaikan pertama yang tepat adalah ...","options":["Menambah hukuman bagi guru","Membuat aturan baru","Memberikan teladan dengan memperbaiki kedisiplinan diri dan konsisten menerapkan aturan","Membiarkan karena kepala sekolah memiliki tugas lain","Mengurangi jam kerja"],"answer":2,"explanation":"Keteladanan memperkuat kredibilitas kepemimpinan.","keywords":"teladan • konsistensi • disiplin"},{"id":6,"competency":"Kepribadian","subcompetency":"Keadilan","question":"Dua guru melakukan pelanggaran yang sama, tetapi salah satunya adalah teman dekat kepala sekolah. Kepala sekolah sebaiknya ...","options":["Memberi perlakuan berbeda","Mengabaikan pelanggaran teman dekat","Menerapkan prosedur secara konsisten berdasarkan fakta dan ketentuan","Meminta guru lain memutuskan","Menutup kasus"],"answer":2,"explanation":"Keadilan berarti konsisten, objektif, dan tidak dipengaruhi kedekatan pribadi.","keywords":"objektif • adil • konsisten"},{"id":7,"competency":"Kepribadian","subcompetency":"Kerahasiaan","question":"Seorang guru menyampaikan masalah pribadi yang sensitif dan meminta agar informasi tersebut tidak disebarluaskan. Kepala sekolah sebaiknya ...","options":["Membahasnya dalam rapat","Menyampaikan kepada semua guru","Menjaga kerahasiaan sesuai batas kewenangan dan kebutuhan penanganan","Membuat pengumuman","Mengunggah ke grup sekolah"],"answer":2,"explanation":"Pemimpin harus menjaga informasi sensitif dan hanya melibatkan pihak yang memang berkepentingan.","keywords":"kerahasiaan • etika • kewenangan"},{"id":8,"competency":"Kepribadian","subcompetency":"Keputusan etis","question":"Orang tua siswa menawarkan hadiah mahal setelah sekolah memberikan layanan yang menjadi hak siswa. Kepala sekolah sebaiknya ...","options":["Menerima secara pribadi","Menerima dan membaginya","Menolak secara santun dan menjaga layanan tetap berdasarkan hak dan prosedur","Menerima untuk kegiatan sekolah tanpa prosedur","Meminta hadiah lain"],"answer":2,"explanation":"Layanan pendidikan tidak boleh dipengaruhi imbalan pribadi.","keywords":"etika • layanan publik • integritas"},{"id":9,"competency":"Kepribadian","subcompetency":"Keteguhan prinsip","question":"Tekanan dari pihak luar meminta sekolah mengubah data capaian agar terlihat lebih baik. Kepala sekolah sebaiknya ...","options":["Mengikuti tekanan","Mengubah sebagian data","Mempertahankan data faktual dan menjelaskan konsekuensi manipulasi","Menghapus data","Meminta operator bertanggung jawab"],"answer":2,"explanation":"Data pendidikan harus faktual dan dapat dipertanggungjawabkan.","keywords":"data faktual • integritas • akuntabilitas"},{"id":10,"competency":"Kepribadian","subcompetency":"Belajar dari kesalahan","question":"Sebuah keputusan kepala sekolah terbukti kurang tepat setelah dievaluasi. Sikap paling profesional adalah ...","options":["Menyembunyikan kesalahan","Menyalahkan tim","Mengakui, menganalisis penyebab, memperbaiki, dan mencegah pengulangan","Menghapus hasil evaluasi","Tidak membahasnya"],"answer":2,"explanation":"Refleksi atas keputusan adalah bagian dari perbaikan berkelanjutan.","keywords":"refleksi • tanggung jawab • perbaikan"},{"id":11,"competency":"Kepribadian","subcompetency":"Pengendalian diri","question":"Dalam rapat, keputusan harus dibuat cepat tetapi informasi belum lengkap. Sikap kepala sekolah adalah ...","options":["Memutuskan berdasarkan emosi","Meminta fakta penting yang tersedia, menilai risiko, lalu menentukan keputusan yang dapat dipertanggungjawabkan","Menyerahkan kepada peserta rapat","Menunda semua keputusan","Mengikuti suara terbanyak tanpa konteks"],"answer":1,"explanation":"Pengendalian diri berarti tidak tergesa-gesa tanpa dasar, tetapi tetap mampu mengambil keputusan proporsional.","keywords":"fakta • risiko • proporsional"},{"id":12,"competency":"Kepribadian","subcompetency":"Orientasi murid","question":"Saat terjadi konflik antara kepentingan kenyamanan orang dewasa dan keselamatan murid, kepala sekolah harus ...","options":["Memilih kenyamanan orang dewasa","Mengutamakan keselamatan dan kepentingan murid dengan proses yang adil","Menghindari konflik","Menyerahkan kepada murid","Menunggu keluhan"],"answer":1,"explanation":"Kepemimpinan sekolah berorientasi pada keselamatan, kebutuhan, dan kesejahteraan murid.","keywords":"murid • keselamatan • kepentingan"},{"id":13,"competency":"Kepribadian","subcompetency":"Kemandirian","question":"Seorang tokoh berpengaruh meminta keputusan khusus untuk keluarganya. Kepala sekolah sebaiknya ...","options":["Mengabulkan","Menolak dengan sopan dan menjelaskan prosedur yang berlaku","Meminta imbalan","Menunda sampai lupa","Memberikan perlakuan khusus secara diam-diam"],"answer":1,"explanation":"Kemandirian profesional menuntut keputusan sesuai prinsip dan aturan, bukan tekanan personal.","keywords":"independen • prosedur • integritas"},{"id":14,"competency":"Kepribadian","subcompetency":"Komitmen mutu","question":"Hasil monitoring menunjukkan program yang dulu dianggap berhasil ternyata tidak lagi efektif. Kepala sekolah sebaiknya ...","options":["Mempertahankan karena sudah lama","Menghentikan tanpa analisis","Meninjau bukti, memperbaiki desain, dan mengukur kembali dampaknya","Menyalahkan pelaksana","Menghapus data"],"answer":2,"explanation":"Komitmen mutu berarti siap memperbaiki praktik berdasarkan bukti.","keywords":"evidence • adaptasi • mutu"},{"id":15,"competency":"Kepribadian","subcompetency":"Komunikasi etis","question":"Kepala sekolah harus menyampaikan keputusan yang tidak populer kepada guru. Cara terbaik adalah ...","options":["Menyampaikan singkat tanpa alasan","Menyampaikan alasan, data, dampak, dan ruang klarifikasi secara terbuka","Meminta wakil menyampaikan","Mengirim pesan tanpa konteks","Menghindari guru"],"answer":1,"explanation":"Komunikasi etis menjelaskan dasar keputusan dan memberi ruang memahami dampaknya.","keywords":"terbuka • alasan • klarifikasi"},{"id":16,"competency":"Sosial","subcompetency":"Kolaborasi","question":"Dua kelompok guru berbeda pendapat mengenai pembagian tugas. Kepala sekolah sebaiknya ...","options":["Memilih kelompok senior","Menetapkan sepihak","Memfasilitasi dialog berbasis kebutuhan dan mencari kesepakatan","Membatalkan kegiatan","Meminta salah satu pihak mengalah"],"answer":2,"explanation":"Kolaborasi dibangun melalui dialog, mendengar kepentingan, dan kesepakatan.","keywords":"dialog • kolaborasi • kesepakatan"},{"id":17,"competency":"Sosial","subcompetency":"Kemitraan orang tua","question":"Kehadiran orang tua dalam kegiatan sekolah rendah. Langkah awal paling tepat adalah ...","options":["Menyalahkan orang tua","Memberi hukuman","Memetakan hambatan dan membangun komunikasi yang relevan","Menghapus kegiatan","Menyerahkan semuanya kepada wali kelas"],"answer":2,"explanation":"Kemitraan dimulai dari memahami hambatan dan kebutuhan.","keywords":"kemitraan • komunikasi • kebutuhan"},{"id":18,"competency":"Sosial","subcompetency":"Inklusi","question":"Seorang murid sering tidak dilibatkan dalam kelompok karena dianggap memperlambat. Kepala sekolah sebaiknya ...","options":["Membiarkan","Memindahkan murid","Menyiapkan dukungan agar murid dapat berpartisipasi secara bermakna","Memberi tugas terpisah selamanya","Menyerahkan kepada orang tua"],"answer":2,"explanation":"Lingkungan inklusif memastikan setiap murid mendapat kesempatan berpartisipasi.","keywords":"inklusi • partisipasi • dukungan"},{"id":19,"competency":"Sosial","subcompetency":"Konflik","question":"Terjadi konflik antara guru dan orang tua mengenai komunikasi pembelajaran. Kepala sekolah sebaiknya ...","options":["Membela salah satu pihak","Menghindari masalah","Menggali fakta dari kedua pihak dan memfasilitasi penyelesaian yang berfokus pada kebutuhan murid","Mengumumkan masalah","Meminta salah satu pihak meminta maaf tanpa dialog"],"answer":2,"explanation":"Penyelesaian konflik memerlukan fakta, dialog, dan orientasi pada kepentingan murid.","keywords":"fakta • mediasi • murid"},{"id":20,"competency":"Sosial","subcompetency":"Jejaring","question":"Sekolah membutuhkan pengembangan kompetensi digital guru. Kepala sekolah dapat ...","options":["Menunggu bantuan","Menghubungkan guru dengan komunitas dan jejaring profesional serta memfasilitasi berbagi praktik","Mewajibkan belajar sendiri","Mengurangi target","Membeli perangkat saja"],"answer":1,"explanation":"Jejaring profesional dapat memperkuat kapasitas guru melalui berbagi praktik.","keywords":"jejaring • komunitas • berbagi praktik"},{"id":21,"competency":"Sosial","subcompetency":"Komunikasi publik","question":"Sekolah menerima pertanyaan masyarakat tentang program baru. Kepala sekolah sebaiknya ...","options":["Menghindari media","Memberikan informasi yang relevan, faktual, dan dapat dipertanggungjawabkan","Menjawab dengan opini pribadi","Menyalahkan guru","Tidak memberi informasi"],"answer":1,"explanation":"Komunikasi publik harus faktual, relevan, dan akuntabel.","keywords":"faktual • transparan • akuntabel"},{"id":22,"competency":"Sosial","subcompetency":"Kesetaraan","question":"Dalam pembagian kesempatan mengikuti pelatihan, kepala sekolah sebaiknya ...","options":["Selalu memilih guru senior","Memilih berdasarkan kedekatan","Menggunakan kebutuhan kompetensi, relevansi tugas, dan kesempatan yang adil","Memilih guru favorit","Mengundi tanpa pertimbangan"],"answer":2,"explanation":"Kesetaraan perlu dipadukan dengan kebutuhan pengembangan profesional.","keywords":"adil • kebutuhan • relevansi"},{"id":23,"competency":"Sosial","subcompetency":"Budaya aman","question":"Terjadi ejekan berulang terhadap seorang murid. Kepala sekolah harus ...","options":["Menganggap bercanda","Menyebut nama pelaku di depan umum","Memastikan keselamatan, menggali fakta, memberi dukungan, dan melakukan tindak lanjut sesuai prosedur","Menghukum seluruh kelas","Menunggu laporan berikutnya"],"answer":2,"explanation":"Respons terhadap masalah keselamatan harus melindungi korban dan ditangani berdasarkan fakta serta prosedur.","keywords":"aman • perlindungan • tindak lanjut"},{"id":24,"competency":"Sosial","subcompetency":"Kearifan lokal","question":"Sekolah ingin memasukkan budaya lokal dalam pembelajaran. Kepala sekolah sebaiknya ...","options":["Menjadikannya kegiatan seremonial saja","Mengintegrasikan secara relevan dengan pembelajaran dan melibatkan sumber daya masyarakat yang tepat","Menghapus materi nasional","Menyerahkan kepada satu tokoh","Meniru sekolah lain"],"answer":1,"explanation":"Kemitraan budaya dapat memperkaya pembelajaran jika relevan dan dikelola secara tepat.","keywords":"budaya lokal • relevansi • kemitraan"},{"id":25,"competency":"Sosial","subcompetency":"Kerja tim","question":"Salah satu tim sekolah tidak berjalan karena pembagian peran tidak jelas. Kepala sekolah sebaiknya ...","options":["Membubarkan tim","Mengambil semua pekerjaan","Memperjelas tujuan, peran, tanggung jawab, mekanisme komunikasi, dan monitoring","Menyalahkan ketua","Menunggu"],"answer":2,"explanation":"Kerja tim memerlukan struktur peran dan komunikasi yang jelas.","keywords":"peran • tanggung jawab • komunikasi"},{"id":26,"competency":"Sosial","subcompetency":"Mendengar aktif","question":"Dalam pertemuan dengan komite, muncul kritik terhadap layanan sekolah. Kepala sekolah sebaiknya ...","options":["Membantah","Mendengar, meminta contoh konkret, mencatat masukan function render(){navRender();if(mode==="home")home();else if(mode==="materi")materi();else if(mode==="latihan")latihan();else if(mode==="simulasi")simulasi();else if(mode==="riwayat")riwayat()}

<section class="card"><h2>Alur belajar</h2><p>Pelajari konsep → latihan kasus → baca pembahasan → ulangi kesalahan → simulasi 70 soal / 120 menit.</p><div class="toolbar"><button class="btn primary" id="start10">Latihan 10 Soal Acak</button><button class="btn" id="start20">Latihan 20 Soal Acak</button><button class="btn" id="start50">Latihan 50 Soal</button></div></section>`;
app.querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>startPractice(10,b.dataset.comp));
document.getElementById("nameBtn").onclick=()=>{let x=prompt("Nama guru:",state.name||"");if(x!==null){state.name=x.trim();save();render()}};
document.getElementById("start10").onclick=()=>startPractice(10);document.getElementById("start20").onclick=()=>startPractice(20);document.getElementById("start50").onclick=()=>startPractice(50)}
function materi(){app.innerHTML=`<section class="card"><h2>Materi inti BCKS</h2><p class="small">Peta belajar ini membantu menghubungkan kasus dengan kompetensi. Gunakan regulasi resmi sebagai rujukan utama.</p><div class="grid">${COMP.map(c=>`<div class="metric"><b>${LABEL[c]}</b><p class="small">${[...new Set(QUESTIONS.filter(q=>q.competency===c).map(q=>q.subcompetency))].slice(0,8).join(" • ")}</p><button class="btn small" data-m="${esc(c)}">Latihan kompetensi →</button></div>`).join("")}</div></section><section class="card"><h2>Kata kunci berpikir</h2><div class="grid"><div class="metric"><b>Berbasis data</b><p class="small">Fakta → akar masalah → prioritas.</p></div><div class="metric"><b>Berpusat pada murid</b><p class="small">Keselamatan, kebutuhan, potensi, kesejahteraan.</p></div><div class="metric"><b>Kolaboratif</b><p class="small">Libatkan pihak sesuai peran.</p></div><div class="metric"><b>Reflektif</b><p class="small">Evaluasi menjadi bahan perbaikan.</p></div><div class="metric"><b>Akuntabel</b><p class="small">Dapat dijelaskan dan dipertanggungjawabkan.</p></div><div class="metric"><b>Tindak lanjut</b><p class="small">Temuan → aksi → monitoring.</p></div></div></section>`;app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>startPractice(10,b.dataset.m))}
function latihan(){app.innerHTML=`<section class="card"><h2>Latihan berdasarkan kompetensi</h2><p>Pilih kompetensi dan jumlah soal. Setelah setiap jawaban, pembahasan langsung ditampilkan.</p><div class="choice-grid">${COMP.map(c=>`<div class="choice"><b>${LABEL[c]}</b><p class="small">${QUESTIONS.filter(q=>q.competency===c).length} soal</p><div class="toolbar"><button class="btn small" data-l="${esc(c)}" data-n="10">10</button><button class="btn small" data-l="${esc(c)}" data-n="20">20</button></div></div>`).join("")}</div></section><section class="card"><h2>Ulangi soal yang salah</h2><p class="small">${state.wrong.length?state.wrong.length+" soal tersimpan.":"Belum ada soal salah tersimpan."}</p><button class="btn primary" id="wrongBtn" ${state.wrong.length?"":"disabled"}>Mulai Pengulangan</button></section>`;app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startPractice(+b.dataset.n,b.dataset.l));document.getElementById("wrongBtn").onclick=startWrong}
function simulasi(){app.innerHTML=`<section class="card hero"><h2>Simulasi Seleksi Substansi BCKS</h2><p>70 soal • 120 menit • kasus kontekstual • hasil dan analisis setelah selesai.</p><div class="grid"><div class="metric"><div class="small">Jumlah</div><b>70</b></div><div class="metric"><div class="small">Waktu</div><b>120 menit</b></div><div class="metric"><div class="small">Mode</div><b>Simulasi</b></div></div><button class="btn primary" style="margin-top:14px" id="simBtn">Mulai Simulasi</button></section><section class="card"><h3>Catatan</h3><p class="small">Ini simulasi latihan, bukan instrumen resmi dan bukan prediksi naskah ujian.</p></section>`;document.getElementById("simBtn").onclick=startSimulation}
function riwayat(){let rows=state.attempts.slice().reverse().slice(0,25).map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.mode)}</td><td>${a.score}/${a.total}</td><td>${a.pct}%</td></tr>`).join("");app.innerHTML=`<section class="card"><div class="section-title"><h2>Riwayat belajar</h2><button class="btn small" id="clearHist">Hapus riwayat</button></div>${rows?`<table class="table"><thead><tr><th>Tanggal</th><th>Mode</th><th>Benar</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody></table>`:"<p class='small'>Belum ada riwayat.</p>"}</section>`;document.getElementById("clearHist").onclick=()=>{if(confirm("Hapus seluruh riwayat dan soal salah?")){state={name:state.name,attempts:[],wrong:[],best:0};save();render()}}}
function startPractice(n=10,comp=null){clearInterval(tick);let pool=comp?QUESTIONS.filter(q=>q.competency===comp):QUESTIONS;pool=shuffle(pool).slice(0,Math.min(n,pool.length));session={pool,index:0,score:0,mode:`Latihan ${pool.length} soal${comp?" • "+LABEL[comp]:""}`,answers:[],time:null};mode="quiz";renderQuiz()}
function startWrong(){clearInterval(tick);let pool=shuffle(QUESTIONS.filter(q=>state.wrong.includes(q.id)));if(!pool.length){alert("Belum ada soal salah.");return}session={pool,index:0,score:0,mode:"Pengulangan soal yang salah",answers:[],time:null};mode="quiz";renderQuiz()}
function startSimulation(){clearInterval(tick);session={pool:shuffle(QUESTIONS).slice(0,70),index:0,score:0,mode:"Simulasi 70 soal / 120 menit",answers:[],time:7200};mode="quiz";renderQuiz();tick=setInterval(()=>{if(!session)return;session.time--;updateTimer();if(session.time<=0)finishQuiz()},1000)}
function updateTimer(){let e=document.getElementById("timer");if(e&&session?.time){let m=Math.floor(session.time/60),s=session.time%60;e.textContent=`${m}:${String(s).padStart(2,"0")}`}}
function renderQuiz(){navRender();let q=session.pool[session.index],total=session.pool.length;app.innerHTML=`<section class="card"><div class="section-title"><div><span class="badge">${LABEL[q.competency]}</span><span class="badge">${esc(q.subcompetency)}</span></div><div class="toolbar"><span class="pill">Soal ${session.index+1}/${total}</span>${session.time!==null?`<span class="pill" id="timer">120:00</span>`:""}<span class="pill">Benar ${session.score}</span></div></div><div class="progress" style="margin:14px 0"><span style="width:${session.index/total*100}%"></span></div><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-o="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="feedback"></div></section><section class="card"><div class="toolbar"><button class="btn small" id="quit">Keluar dari latihan</button><span class="small right">Pembahasan muncul setelah jawaban.</span></div></section>`;if(session.time!==null)updateTimer();document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.o));document.getElementById("quit").onclick=()=>{if(confirm("Keluar dari sesi ini?")){clearInterval(tick);session=null;mode="home";render()}}}
function answer(n){let q=session.pool[session.index],bs=document.querySelectorAll(".option"),ok=n===q.answer;bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===n&&n!==q.answer)b.classList.add("wrong")});if(ok)session.score++;session.answers.push({id:q.id,chosen:n,correct:ok});if(!ok&&!state.wrong.includes(q.id))state.wrong.push(q.id);save();document.getElementById("feedback").innerHTML=`<div class="explain ${ok?"good":"bad"}"><b>${ok?"✓ Jawaban tepat":"✕ Jawaban belum tepat"}</b><p><b>Pembahasan:</b> ${esc(q.explanation)}</p><p><b>Kata kunci:</b> ${esc(q.keywords)}</p><p class="small"><b>Kompetensi:</b> ${esc(q.competency)} • <b>Subkompetensi:</b> ${esc(q.subcompetency)}</p><button class="btn primary" id="next">${session.index===session.pool.length-1?"Lihat hasil":"Soal berikutnya →"}</button></div>`;document.getElementById("next").onclick=()=>{session.index++;if(session.index>=session.pool.length)finishQuiz();else renderQuiz()}}
function finishQuiz(){clearInterval(tick);if(!session)return;let total=session.pool.length,pct=Math.round(session.score/total*100);state.attempts.push({date:new Date().toISOString(),mode:session.mode,score:session.score,total,pct,answers:session.answers});state.best=Math.max(state.best||0,pct);save();let by={};COMP.forEach(c=>{let ids=new Set(session.pool.filter(q=>q.competency===c).map(q=>q.id)),a=session.answers.filter(x=>ids.has(x.id));if(a.length)by[c]=Math.round(a.filter(x=>x.correct).length/a.length*100)});let analysis=Object.entries(by).map(([c,p])=>`<div class="barrow"><div>${LABEL[c]}</div><div class="barmini"><span style="width:${p}%"></span></div><div>${p}%</div></div>`).join(""),wrong=session.answers.filter(x=>!x.correct).length;app.innerHTML=`<section class="card center hero"><div class="small">${esc(session.mode)}</div><div class="score">${pct}%</div><div>${session.score} benar dari ${total} soal</div><div style="color:#9a7180;letter-spacing:3px">${pct>=85?"★★★★★":pct>=70?"★★★★☆":pct>=55?"★★★☆☆":"★★☆☆☆"}</div></section><section class="card"><h2>Analisis kompetensi</h2>${analysis||"<p class='small'>Analisis tersedia pada latihan campuran.</p>"}</section><section class="card"><h2>Rekomendasi</h2><p>${wrong?`Ada <b>${wrong}</b> soal belum tepat. Soal tersebut otomatis masuk menu <b>Ulangi Soal yang Salah</b>.`:"Semua jawaban tepat pada sesi ini."}</p><div class="toolbar"><button class="btn primary" id="again">Latihan lagi</button><button class="btn" id="back">Beranda</button></div></section>`;document.getElementById("again").onclick=()=>startPractice(Math.min(20,total));document.getElementById("back").onclick=()=>{mode="home";render()};session=null;navRender()}
function toggleMusic(){if(audioOn)stopMusic();else startMusic();navRender()}
function startMusic(){const C=window.AudioContext||window.webkitAudioContext;if(!C){alert("Browser tidak mendukung audio.");return}audio=new C();audio.resume();let gain=audio.createGain();gain.gain.value=.12;gain.connect(audio.destination);audioOn=true;let notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],i=0;function play(){if(!audioOn)return;let o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.001,audio.currentTime);g.gain.linearRampToValueAtTime(.18,audio.currentTime+.5);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+2.6);o.connect(g);g.connect(gain);o.start();o.stop(audio.currentTime+2.7);setTimeout(play,1500)}play()}
function stopMusic(){audioOn=false;if(audio){try{audio.close()}catch(e){}}audio=null}
render();
</script></body></html>
